<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Anchors every emitted asset URL to the site root. Without it the builder
      writes the bundles as relative paths ("main-x.js"), which a deep link
      resolves against its own directory: /campaigns/<id> asks for
      /campaigns/main-x.js, the SPA fallback answers with index.html, and the
      browser parses HTML as JavaScript and renders nothing. One-segment routes
      happened to work, so this only ever broke /campaigns/:id and /agents/:key.
    -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echo by Cognilix</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="32x32" />
    <meta name="description" content="Echo by Cognilix: build voice agents, run calling campaigns from a sheet, and get every answer back." />
    <meta name="theme-color" content="#da291c" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Echo by Cognilix" />
    <meta property="og:description" content="Echo by Cognilix: build voice agents, run calling campaigns from a sheet, and get every answer back." />
    <meta property="og:image" content="icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
      <!-- Theme before first paint (also on the sign in page): no white flash for dark mode users. -->
    <script>try{var t=localStorage.getItem('echo.theme')||'system';var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}catch(e){}</script>
    <style>html{background:#fff}html[data-theme="dark"]{background:#000}</style>
</head>
  <body>
    <app-root></app-root>
  </body>
</html>
