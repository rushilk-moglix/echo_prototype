# Serves the built Angular app. Nothing is proxied: API_BASE in
# src/app/core/endpoints.ts is an absolute URL, so the browser calls the backend
# directly and never routes API traffic through here.
#
# That makes the backend's CORS_ORIGINS the thing to keep in step with wherever
# this is deployed. If you would rather have one origin and no CORS, set
# API_BASE to '' and add proxy_pass blocks for /api, /health, /webrtc and
# /ozonetel — the WebSocket one needs the Upgrade headers.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bundles carry a content hash in the filename, so they can be cached
    # indefinitely; index.html must not be, or a deploy leaves browsers loading
    # the previous bundle names forever.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: a deep link like /agents/rfx_reminder is not a file
    # and must return index.html, or the router never gets a chance to handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
